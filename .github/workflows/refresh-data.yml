name: Refresh data

# Every 3 hours (at 17 minutes past, to avoid the busy top of the hour), a manual "Run workflow" button,
# and right after overrides.json or index.html changes, so shared projects and fixes are checked within minutes.
# (The workflow's own commits to data/ don't trigger it again.)
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - overrides.json
      - index.html

# The job only needs to commit the files in data/.
permissions:
  contents: write

# Never run two refreshes at once.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # Always start from the latest main, not the commit that triggered the run, so re-runs and
          # back-to-back uploads don't try to push on top of an out-of-date copy.
          ref: main
          fetch-depth: 0

      - name: Refresh covers, itch.io devlogs and project status
        env:
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          # The job's own token reads public repositories through GitHub's GraphQL API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a fine-grained personal token (public repositories, read-only) if the job's token ever runs short.
          PW_GH_TOKEN: ${{ secrets.PW_GH_TOKEN }}
        run: python3 scripts/refresh_data.py

      - name: Commit changed data
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh data"
          # If main moved on while the job ran (another upload, or an earlier refresh), put this
          # commit on top of it and try again. Only this workflow writes data/, so this doesn't conflict.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt didn't go through; retrying."
            sleep $((attempt * 5))
          done
          echo "Couldn't push the refreshed data after 3 attempts."
          exit 1
